[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
earshot-ffi = { path = "crates/earshot-ffi" }

# Third party
anyhow = "1.0.104"
cbindgen = { version = "0.29.4", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
sha2 = "0.11.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"

# The natives shipped in the mod jar (`cargo xtask natives`/`dist`), as in
# yakvc: one jar carries every platform's library, so optimize for size; the
# acoustics crates will opt back into full speed as they arrive.
[profile.dist]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
